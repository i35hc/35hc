<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0710" />
    <meta
      name="description"
      content="صفحة شامخ الشخصية."
    />
    <title>شامخ | 🇸🇦</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=Oxanium:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span class="aurora-blob blob-a"></span>
      <span class="aurora-blob blob-b"></span>
      <span class="aurora-blob blob-c"></span>
    </div>
    <div class="noise-layer" aria-hidden="true"></div>

    <main class="profile-shell">
      <section class="card" aria-labelledby="profile-name">
        <div class="avatar-wrap">
          <span class="avatar-glow" aria-hidden="true"></span>
          <span class="avatar-ring" aria-hidden="true"></span>
          <div class="avatar-frame">
            <img id="profile-image" class="profile-image" alt="صورة شامخ الشخصية" />
            <span class="avatar-fallback" aria-hidden="true">شامخ</span>
          </div>
        </div>

        <p class="badge">STREAMER</p>
        <h1 id="profile-name">شامخ | 🇸🇦</h1>

        <a class="support-link" id="support-link" href="#" target="_blank" rel="noopener noreferrer">
          <span class="support-pulse" aria-hidden="true"></span>
          <i class="fa-solid fa-heart" aria-hidden="true"></i>
          <span id="support-title">ادعمني</span>
        </a>

        <section class="supporters" aria-labelledby="donations-heading">
          <h2 id="donations-heading"><i class="fa-solid fa-heart" aria-hidden="true"></i> آخر الداعمين بالدونيشن</h2>
          <div class="ticker-frame ticker-frame-dark">
            <iframe
              src="https://streamlabs.com/widgets/tip-ticker?token=984853A31D81E6016024"
              title="آخر الداعمين بالدونيشن"
              loading="lazy"
              scrolling="no"
              frameborder="0"
              referrerpolicy="no-referrer"
            ></iframe>
          </div>
        </section>

        <section class="supporters" aria-labelledby="supporters-heading">
          <h2 id="supporters-heading"><i class="fa-solid fa-crown" aria-hidden="true"></i> أفضل الداعمين</h2>
          <div class="ticker-frame">
            <iframe
              src="https://tikfinity.zerody.one/widget/topgifter?cid=3168279"
              title="أفضل الداعمين"
              loading="lazy"
              scrolling="no"
              frameborder="0"
            ></iframe>
          </div>
        </section>
      </section>
    </main>

    <footer>© <span id="year"></span> <span id="footer-name">شامخ</span>. جميع الحقوق محفوظة.</footer>
    <script src="script.js"></script>
  </body>
</html>
